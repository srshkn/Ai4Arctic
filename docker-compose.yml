version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: test-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: Ai4Arctic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Ai4Arctic"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend 
      dockerfile: Dockerfile
    container_name: test-backend-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

    ports:
      - "8080:8000"

volumes:
  postgres_data: