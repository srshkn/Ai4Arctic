name: Docker CI

on:
  push:
    branches:
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Install Hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfile
        run: hadolint backend/Dockerfile

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: test-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Wait for app on localhost:8080
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/docs > /dev/null; then
              echo "Service is up"
              exit 0
            fi
            echo "Waiting for service..."
            sleep 2
          done
          echo "Service did not become ready in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/docs > /dev/null
          curl -fsS http://localhost:8080/openapi.json > /dev/null

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v